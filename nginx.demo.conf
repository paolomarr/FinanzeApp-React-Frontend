# nginx config for the demo image (Dockerfile.demo): serves the React app
# and proxies the API, the Django admin and its static files, so frontend
# and backend share one origin (no CORS).

# Behind another HTTPS reverse proxy (e.g. the host's nginx), keep the
# scheme it reports, or Django sees plain http and, with DEMO_HTTPS=1,
# redirects forever; when reached directly, use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # voice recordings and receipt images are posted to the API
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django admin CSS/JS, served by Django itself (WhiteNoise)
    location /static/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routes (/movements, /trading, ...) all load the app
    location / {
        try_files $uri /index.html;
    }
}
