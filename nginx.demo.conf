# nginx config for the demo image (Dockerfile.demo): serves the React app
# and proxies the API, so frontend and backend share one origin (no CORS).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # voice recordings and receipt images are posted to the API
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routes (/movements, /trading, ...) all load the app
    location / {
        try_files $uri /index.html;
    }
}
